<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Shop Manager — Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <input type="checkbox" id="menu-state" class="menu-state" aria-label="Toggle Main Menu">

  <header class="topbar">
    <label class="menu-toggle" for="menu-state" aria-label="Open Main Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </label>
    <input class="search" type="search" placeholder="Search..." aria-label="Search">
    <button class="profile" type="button">User Profile</button>
  </header>

  <label class="drawer-backdrop" for="menu-state" aria-label="Close menu"></label>
  <aside class="sidebar" id="sidebar" aria-label="Main Menu">
    <label class="sidebar-close" for="menu-state" aria-label="Close menu">×</label>
    <div class="sidebar-brand">Laundry Shop Management System</div>
    <p class="sidebar-heading">Main Menu</p>
    <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="customers.html">Customers</a>
        <a class="active" href="services.html">Services</a>
        <a href="staff.html">Staff</a>
        <a href="service_type.html">Service Type</a>
        <a href="laundry-orders.html">Laundry Orders</a>
        <a href="payments.html">Payments</a>
    </nav>
  </aside>

  <main class="content services-content" id="services">
    <div class="heading-row">
      <h1>Services</h1>
    </div>
    <div class="table-wrap services-table-wrap">
      <table class="services-table">
        <thead>
          <tr><th>Service</th><th>Unit</th><th>Current Price</th><th>Action</th></tr>
        </thead>
        <tbody>
          <tr><td>Wash and Fold</td><td>KG</td><td><input class="price-input" type="number" value="150.00" aria-label="Wash and Fold price"></td><td><button class="btn btn-save" type="button">Save Price</button></td></tr>
          <tr><td>Wash, Dry and Fold</td><td>KG</td><td><input class="price-input" type="number" value="250.00" aria-label="Wash Dry and Fold price"></td><td><button class="btn btn-save" type="button">Save Price</button></td></tr>
          <tr><td>Drying Cleaning</td><td>PIECE</td><td><input class="price-input" type="number" value="180.00" aria-label="Drying Cleaning price"></td><td><button class="btn btn-save" type="button">Save Price</button></td></tr>
          <tr><td>Comforter Cleaning</td><td>PIECE</td><td><input class="price-input" type="number" value="350.00" aria-label="Comforter Cleaning price"></td><td><button class="btn btn-save" type="button">Save Price</button></td></tr>
          <tr><td>Ironing</td><td>PIECE</td><td><input class="price-input" type="number" value="100.00" aria-label="Ironing price"></td><td><button class="btn btn-save" type="button">Save Price</button></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
